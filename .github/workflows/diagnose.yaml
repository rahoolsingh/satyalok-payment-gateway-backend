name: Diagnose backend

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.SSH_HOST}}
          username: ${{secrets.SSH_USERNAME}}
          key: ${{secrets.SSH_KEY}}
          command_timeout: 5m
          script: |
            cd /root/Satyalok_PG_Backend
            echo "== disk =="
            df -h /
            echo "== compose ps =="
            docker compose ps -a
            echo "== container logs =="
            docker compose logs --tail=160 app || true
            echo "== docker df =="
            docker system df || true
            echo "== restart =="
            docker compose up -d --force-recreate
            sleep 8
            docker compose ps -a
            curl -s -o /dev/null -w 'local health: %{http_code}\n' http://127.0.0.1:5002/ || true
