name: Diagnose backend

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Try Razorpay webhook payload shapes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.SSH_HOST}}
          username: ${{secrets.SSH_USERNAME}}
          key: ${{secrets.SSH_KEY}}
          command_timeout: 5m
          script: |
            cd /root/Satyalok_PG_Backend
            KEY_ID=$(grep '^RAZORPAY_KEY_ID=' .env | cut -d= -f2-)
            KEY_SECRET=$(grep '^RAZORPAY_KEY_SECRET=' .env | cut -d= -f2-)
            HOOK_SECRET=$(grep '^RAZORPAY_WEBHOOK_SECRET=' .env | cut -d= -f2-)
            HOOK_URL="https://server.veerrajpoot.com/satyalok-pg-backend/webhook/razorpay"
            api() { curl -s -u "$KEY_ID:$KEY_SECRET" -H 'Content-Type: application/json' -X POST https://api.razorpay.com/v1/webhooks -d "$1" | sed "s/$HOOK_SECRET/[redacted]/g" | head -c 600; echo; }

            echo "== A events map + alert_email =="
            api "$(printf '{"url":"%s","secret":"%s","alert_email":"support@satyalok.in","active":true,"events":{"payment.captured":true,"order.paid":true,"payment.failed":true,"subscription.authenticated":true,"subscription.activated":true,"subscription.charged":true,"subscription.pending":true,"subscription.halted":true,"subscription.paused":true,"subscription.resumed":true,"subscription.cancelled":true,"subscription.completed":true}}' "$HOOK_URL" "$HOOK_SECRET")"

            echo "== B event singular =="
            api "$(printf '{"url":"%s","secret":"%s","alert_email":"support@satyalok.in","event":"payment.captured"}' "$HOOK_URL" "$HOOK_SECRET")"

            echo "== C events array + alert_email =="
            api "$(printf '{"url":"%s","secret":"%s","alert_email":"support@satyalok.in","events":["payment.captured"]}' "$HOOK_URL" "$HOOK_SECRET")"

            echo "== D events string =="
            api "$(printf '{"url":"%s","secret":"%s","events":"payment.captured"}' "$HOOK_URL" "$HOOK_SECRET")"
