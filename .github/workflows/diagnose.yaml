name: Diagnose backend

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect server and webhook registration
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.SSH_HOST}}
          username: ${{secrets.SSH_USERNAME}}
          key: ${{secrets.SSH_KEY}}
          command_timeout: 5m
          script: |
            cd /root/Satyalok_PG_Backend
            KEY_ID=$(grep '^RAZORPAY_KEY_ID=' .env | cut -d= -f2-)
            KEY_SECRET=$(grep '^RAZORPAY_KEY_SECRET=' .env | cut -d= -f2-)
            HOOK_SECRET=$(grep '^RAZORPAY_WEBHOOK_SECRET=' .env | cut -d= -f2-)
            HOOK_URL="https://server.veerrajpoot.com/satyalok-pg-backend/webhook/razorpay"

            echo "== existing hooks =="
            curl -s -u "$KEY_ID:$KEY_SECRET" https://api.razorpay.com/v1/webhooks \
              | sed "s/$HOOK_SECRET/[redacted]/g" \
              | head -c 1200
            echo

            echo "== bulk create =="
            BODY=$(printf '{"url":"%s","secret":"%s","events":["payment.captured","order.paid","payment.failed","subscription.authenticated","subscription.activated","subscription.charged","subscription.pending","subscription.halted","subscription.paused","subscription.resumed","subscription.cancelled","subscription.completed"],"active":true}' "$HOOK_URL" "$HOOK_SECRET")
            curl -s -u "$KEY_ID:$KEY_SECRET" -H 'Content-Type: application/json' -X POST https://api.razorpay.com/v1/webhooks -d "$BODY" \
              | sed "s/$HOOK_SECRET/[redacted]/g" \
              | head -c 1200
            echo

            echo "== single event create =="
            BODY2=$(printf '{"url":"%s","secret":"%s","events":["subscription.charged"],"active":true}' "$HOOK_URL" "$HOOK_SECRET")
            curl -s -u "$KEY_ID:$KEY_SECRET" -H 'Content-Type: application/json' -X POST https://api.razorpay.com/v1/webhooks -d "$BODY2" \
              | sed "s/$HOOK_SECRET/[redacted]/g" \
              | head -c 1200
            echo
