name: Deploy backend on server

on:
  push:
    branches:
      - main

concurrency:
  group: satyalok-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
        with:
          host: ${{secrets.SSH_HOST}}
          username: ${{secrets.SSH_USERNAME}}
          key: ${{secrets.SSH_KEY}}
          envs: RAZORPAY_KEY_ID,RAZORPAY_KEY_SECRET
          # Image export occasionally takes >10 minutes on a slow registry day.
          command_timeout: 45m
          script: |
            cd /root/Satyalok_PG_Backend
            # Presence only — never print values. Answers "why is recurring off?"
            echo "Recurring env presence:"
            for k in RAZORPAY_ENABLED RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET PHONEPE_AUTOPAY_ENABLED PHONEPE_AUTOPAY_CLIENT_ID PHONEPE_AUTOPAY_CLIENT_SECRET PHONEPE_AUTOPAY_WEBHOOK_USERNAME PHONEPE_AUTOPAY_WEBHOOK_PASSWORD PLEDGE_ENCRYPTION_KEY PLEDGE_HASH_PEPPER PLEDGE_PORTAL_SECRET PLEDGE_CRON_ENABLED SALT_KEY MERCHANT_ID; do
              if grep -Eq "^[[:space:]]*(export[[:space:]]+)?$k=..*" .env 2>/dev/null; then
                echo "  $k: present"
              else
                echo "  $k: absent"
              fi
            done
            # ── Runtime secrets/config ───────────────────────────────────
            # Values are written to .env, never echoed. Keys come from GitHub
            # Actions secrets; the encryption/webhook secrets are generated once
            # on the server and reused on later deploys.
            upsert() { k="$1"; v="$2"; [ -z "$v" ] && return 0; if grep -q "^$k=" .env; then sed -i "s|^$k=.*|$k=$v|" .env; else printf '\n%s=%s\n' "$k" "$v" >> .env; fi; }
            ensure_random() { k="$1"; if ! grep -Eq "^$k=..*" .env; then upsert "$k" "$(openssl rand -hex 32)"; fi; }

            upsert RAZORPAY_KEY_ID "$RAZORPAY_KEY_ID"
            upsert RAZORPAY_KEY_SECRET "$RAZORPAY_KEY_SECRET"
            upsert RAZORPAY_ENABLED "true"
            ensure_random RAZORPAY_WEBHOOK_SECRET
            ensure_random PLEDGE_ENCRYPTION_KEY
            ensure_random PLEDGE_HASH_PEPPER
            ensure_random PLEDGE_PORTAL_SECRET
            upsert PLEDGE_CRON_ENABLED "true"

            # Register the Razorpay webhook once. The secret stays on the server.
            KEY_ID=$(grep '^RAZORPAY_KEY_ID=' .env | cut -d= -f2-)
            KEY_SECRET=$(grep '^RAZORPAY_KEY_SECRET=' .env | cut -d= -f2-)
            HOOK_SECRET=$(grep '^RAZORPAY_WEBHOOK_SECRET=' .env | cut -d= -f2-)
            HOOK_URL="https://server.veerrajpoot.com/satyalok-pg-backend/webhook/razorpay"
            if [ -n "$KEY_ID" ] && [ -n "$KEY_SECRET" ]; then
              HOOKS=$(curl -s -u "$KEY_ID:$KEY_SECRET" https://api.razorpay.com/v1/webhooks || true)
              if printf '%s' "$HOOKS" | grep -q "$HOOK_URL"; then
                echo "Razorpay webhook: already registered"
              else
                BODY=$(printf '{"url":"%s","secret":"%s","events":["payment.captured","order.paid","payment.failed","subscription.authenticated","subscription.activated","subscription.charged","subscription.pending","subscription.halted","subscription.paused","subscription.resumed","subscription.cancelled","subscription.completed"],"active":true}' "$HOOK_URL" "$HOOK_SECRET")
                HOOK_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -u "$KEY_ID:$KEY_SECRET" -H 'Content-Type: application/json' -X POST https://api.razorpay.com/v1/webhooks -d "$BODY")
                echo "Razorpay webhook: registration HTTP $HOOK_STATUS"
                if [ "$HOOK_STATUS" != "200" ] && [ "$HOOK_STATUS" != "201" ]; then
                  head -c 300 /tmp/rzp-hook.json || true
                  echo
                fi
              fi
            else
              echo "Razorpay webhook: skipped (keys missing)"
            fi

            # Server-local edits (hotfixes, config tweaks) must never block a
            # deploy. Save them to a patch + stash before pulling; the patch
            # stays on the server for recovery.
            git diff > /root/Satyalok_PG_Backend_local_$(date -u +%Y%m%dT%H%M%SZ).patch || true
            git stash push -u -m "auto-stash before deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
            git pull --ff-only
            docker compose up -d --build --force-recreate
            docker image prune -f
            echo "Deployed $(git rev-parse --short HEAD) from $(git rev-parse --abbrev-ref HEAD)"
            docker compose ps
            